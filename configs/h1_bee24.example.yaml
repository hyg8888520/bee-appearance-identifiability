experiment:
  name: bee24_h1_dinov3_retrieval
  seed: 24
  device: cuda:0

dataset:
  root: /CHANGE/ME/BEE24
  annotation: /CHANGE/ME/BEE24/train.json
  max_images: null

models:
  dinov3:
    checkpoint: /CHANGE/ME/dinov3_vits16_pretrain.pth
    model_name: vit_small_patch16_dinov3.lvd1689m
    image_size: [224, 224]
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
    interpolation: bicubic
    global_pool: token
    batch_size: 64
    num_workers: 8
    use_amp: true
    amp_dtype: bfloat16
    normalize_features: true

h1:
  query_image_ids: []
  query_stride: 100
  top_k: 10
  reuse_feature_cache: true

output:
  root: /CHANGE/ME/experiments/bee24_h1
  feature_cache: feature_cache/dinov3_features.pt
  query_results: query_results/retrieval.json
  figures: figures
  failure_cases: failure_cases
  metadata: metadata/run.json

