# Real-data subset smoke. Copy to h6_smoke.local.yaml and edit external paths.
# This subset can validate execution only; it can never make the method READY.
paths:
  bee24_root: /path/to/datasets/BEE24
  h1_output_root: /path/to/experiments/beeid/h1
  h3_output_root: /path/to/experiments/beeid/h3-gt-dev
  output_root: /path/to/experiments/beeid/h6-smoke
  cache_root: /path/to/experiments/beeid/cache-h3
  dinov3_repo: /path/to/third_party/dinov3
  dinov3_weights: /path/to/checkpoints/dinov3/dinov3_vits16.pth
  topictrack_repo: /path/to/third_party/TOPICTrack
  topic_agw_weights: /path/to/checkpoints/topictrack/bee_agw_s50.pth
  dino_python: /path/to/venvs/beeid-dino/bin/python
  topic_python: /path/to/venvs/beeid-topic/bin/python
runtime: {device: 'cuda:0', batch_size: 32, num_workers: 4, amp: true, amp_dtype: float16, seed: 24, cache_shard_size: 512}
dataset: {source_splits: [train], bbox_origin: one, invalid_bbox_policy: skip, duplicate_identity_policy: exclude_conflict, missing_seqinfo_policy: infer_from_images, confidence_min: 0.0, validation_fraction: 0.2, max_videos: null, max_frames_per_video: 80, video_ids: [BEE24-01, BEE24-02, BEE24-03], deep_validate_images: false}
protocol: {deltas: [1, 5, 10, 25], crop_expansion: 0.2, input_size: 224, hard_negative_k: 5, evaluation_split: validation, failure_top_k: 10}
models: {resnet_weights: IMAGENET1K_V2, dinov3_hub_model: dinov3_vits16, dinov3_feature_source: patch_mean, topic_config_relative: fast-reid/configs/bee/AGW_S50.yml}
h3:
  protocol_lock: h3_protocol.lock.yaml
  protocol_checksum: h3_protocol.lock.sha256
  project_split: splits/project_split.yaml
  allow_subset: true
  stage: gt_detection_boxes
  fixed_detections_root: null
  history_length: 5
  quantile_knots: 101
  min_reliability: 0.05
  memory_alpha: 0.2
  update_gate: 0.25
  appearance_weight: 0.7
  motion_weight: 0.3
  max_normalized_distance: 4.0
  min_assignment_score: 0.1
  max_age: 25
  bootstrap_replicates: 1000
h6:
  protocol_lock: h6_protocol.lock.yaml
  protocol_checksum: h6_protocol.lock.sha256
  project_split: splits/project_split.yaml
  allow_subset: true
  baseline_variant: baseline_association
  window_length: 64
  window_stride: 32
  max_frame_gap: 12
  hidden_dim: 64
  num_heads: 4
  num_layers: 2
  feedforward_dim: 256
  dropout: 0.1
  epochs: 2
  learning_rate: 0.0002
  weight_decay: 0.05
  gradient_clip_norm: 1.0
  max_tokens_per_batch: 512
  max_train_windows_per_video: 4
  negative_positive_ratio: 16.0
  association_loss_weight: 1.0
  contrastive_loss_weight: 0.25
  cycle_loss_weight: 0.1
  calibration_fraction: 0.2
  min_oracle_edge_recall: 0.98
  min_calibration_precision: 0.9
  max_calibration_harm: 0.05
  min_calibration_interventions: 1
  min_calibration_videos: 1
  min_assignment_probability: 0.1
  noninferiority_tolerance: 0.002
  min_nonharmed_videos: 1
  checkpoint_interval_batches: 1
  random_seed: 24
