name: CPU tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU PyTorch and project
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.7.1 torchvision==0.22.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy>=1.26,<3' 'Pillow>=10,<13' 'PyYAML>=6,<7' 'pytest>=8,<9'
          python -m pip install --no-deps -e .
      - name: Unit tests
        run: pytest -q
      - name: Synthetic smoke (test-only encoder, no GPU claim)
        run: |
          beeid synthetic-smoke
          beeid h2-synthetic-smoke
          beeid h25-synthetic-smoke
          beeid h3-validate-protocol --protocol configs/h3_protocol.lock.yaml --checksum configs/h3_protocol.lock.sha256
          beeid h4-validate-protocol --protocol configs/h4_protocol.lock.yaml --checksum configs/h4_protocol.lock.sha256
          beeid h4-synthetic-smoke
          beeid h41-validate-protocol --protocol configs/h41_protocol.lock.yaml --checksum configs/h41_protocol.lock.sha256
          beeid h41-synthetic-smoke
