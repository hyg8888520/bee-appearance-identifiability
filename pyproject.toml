[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bee24-dinotrack"
version = "0.1.0"
description = "Portable DINOv3 feature-retrieval experiments for the BEE24 dataset"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "Pillow>=10,<13",
    "PyYAML>=6,<7",
    "pytest>=8,<9",
    "timm>=1.0.20,<2",
    "torch>=2.7.1",
    "torchvision>=0.22.1",
]

[project.scripts]
bee24-h1 = "bee24_dinotrack.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

