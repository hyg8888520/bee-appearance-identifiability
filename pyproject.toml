[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bee-appearance-identifiability"
version = "0.7.3"
description = "Reproducible BEE24 appearance diagnostics and BeeTrackQuery H5 tracking"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26,<3",
    "Pillow>=10,<13",
    "PyYAML>=6,<7",
    "torch==2.7.1",
    "torchvision==0.22.1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
beeid = "beeid.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
